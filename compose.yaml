services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trade_agent
      POSTGRES_USER: trade_agent
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trade_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_agent -d trade_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trade_agent_postgres:

