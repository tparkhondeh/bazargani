[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bazargani-trade-agent"
version = "0.1.0"
description = "Evidence-first trade research and landed-cost decision engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Bazargani Team" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
trade-agent = "trade_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
